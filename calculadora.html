<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link rel="stylesheet" href="src/reset.css">
    <link rel="stylesheet" href="src/style.css">
    <link rel="shortcut icon" href="favicoon.ico" type="image/x-icon">
</head>
<body>
    <main>
        <section class="calculadora">
            <div class="visor"><span id="visor">Exemplo1234</span></div>
            <button type="button" class="sqrt" id="sqrt">√</button>
            <button type="button" class="pi" id="pi">π</button>
            <button type="button" class="pow" id="pow">^</button>
            <button type="button" class="fact" id="fact">!</button>
            <button type="button" class="log" id="log">log</button>
            <button type="button" class="sin" id="sin">sin</button>
            <button type="button" class="cos" id="cos">cos</button>
            <button type="button" class="tan" id="tan">tan</button>
            <button type="button" class="ln" id="ln">ln</button>
            <button type="button" class="e" id="e">e</button>
            <button type="button" class="lpar" id="lpar">&lpar;</button>
            <button type="button" class="rpar" id="rpar">&rpar;</button>
            <button type="button" class="clear action" id="clear">C</button>
            <button type="button" class="perc action" id="perc">%</button>
            <button type="button" class="slash action" id="slash">÷</button>
            <button type="button" class="seven" id="seven">7</button>
            <button type="button" class="eight" id="eight">8</button>
            <button type="button" class="nine" id="nine">9</button>
            <button type="button" class="times action" id="times">×</button>
            <button type="button" class="four" id="four">4</button>
            <button type="button" class="five" id="five">5</button>
            <button type="button" class="six" id="six">6</button>
            <button type="button" class="plus action" id="plus">+</button>
            <button type="button" class="one" id="one">1</button>
            <button type="button" class="two" id="two">2</button>
            <button type="button" class="three" id="three">3</button>
            <button type="button" class="minus action" id="minus">-</button>
            <button type="button" class="zero" id="zero">0</button>
            <button type="button" class="dot" id="dot">.</button>
            <button type="button" class="backspace" id="backspace">&#9003;</button>
            <button type="button" class="equal" id="equal">=</button>
        </section>
    </main>
</body>
<script src="src/script.js"></script>
</html>
