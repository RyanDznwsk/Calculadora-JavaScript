<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link rel="stylesheet" href="src/reset.css">
    <link rel="stylesheet" href="src/style.css">
    <link rel="shortcut icon" href="favicoon.ico" type="image/x-icon">
</head>
<body>
    <main>
        <section class="calculadora">
            <div class="visor"><span id="visor">Exemplo1234</span></div>
            <button type="button" class="sqrt" id="sqrt" value="sqrt">√</button>
            <button type="button" class="pi" id="pi" value="pi">π</button>
            <button type="button" class="pow" id="pow" value="pow">^</button>
            <button type="button" class="fact" id="fact" value="fact">!</button>
            <button type="button" class="log" id="log" value="log">log</button>
            <button type="button" class="sin" id="sin" value="sin">sin</button>
            <button type="button" class="cos" id="cos" value="cos">cos</button>
            <button type="button" class="tan" id="tan" value="tan">tan</button>
            <button type="button" class="ln" id="ln" value="ln">ln</button>
            <button type="button" class="e" id="e" value="e">e</button>
            <button type="button" class="lpar" id="lpar" value="lpar">&lpar;</button>
            <button type="button" class="rpar" id="rpar" value="rpar">&rpar;</button>
            <button type="button" class="clear action" id="clear" value="clear">C</button>
            <button type="button" class="perc action" id="perc" value="perc">%</button>
            <button type="button" class="slash action" id="slash" value="slash">÷</button>
            <button type="button" class="seven" id="seven" value="sqrt" value="seven">7</button>
            <button type="button" class="eight" id="eight" value="eight">8</button>
            <button type="button" class="nine" id="nine" value="nine">9</button>
            <button type="button" class="times action" id="times" value="times">×</button>
            <button type="button" class="four" id="four" value="four">4</button>
            <button type="button" class="five" id="five" value="five">5</button>
            <button type="button" class="six" id="six" value="six">6</button>
            <button type="button" class="plus action" id="plus" value="plus">+</button>
            <button type="button" class="one" id="one" value="one">1</button>
            <button type="button" class="two" id="two" value="two">2</button>
            <button type="button" class="three" id="three" value="three">3</button>
            <button type="button" class="minus action" id="minus" value="minus">-</button>
            <button type="button" class="zero" id="zero" value="zero">0</button>
            <button type="button" class="dot" id="dot" value="dot">.</button>
            <button type="button" class="backspace" id="backspace" value="backspace">&#9003;</button>
            <button type="button" class="equal" id="equal" value="equal">=</button>
        </section>
    </main>
</body>
<script src="src/script.js"></script>
</html>
